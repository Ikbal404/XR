<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js XR - Controls Transform (Custom Button)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<style>
            body { margin: 0; overflow: hidden; }
            #info {
                position: absolute;
                top: 0px;
                width: 100%;
                color: #ffffff;
                padding: 5px;
                font-family: monospace;
                font-size: 13px;
                font-weight: bold;
                text-align: center;
                z-index: 1;
            }
            a { color: #ffffff; }
            /* Styling untuk tombol kustom */
            #xr-button-custom {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 24px;
                background-color: #585858;
                color: white;
                border: 2px solid white;
                font-weight: bold;
                font-family: Arial, sans-serif;
                font-size: 16px;
                cursor: pointer;
                width: 150px;
                text-align: center;
                z-index: 100; /* Pastikan di atas canvas */
            }
        </style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> xr - controls - transform (Tombol Kustom)
		</div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/TransformControls.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/webxr/XRControllerModelFactory.js"></script>

        <script>
            // Pastikan semua script CDN di atas sudah dimuat dan diurai sebelum inisialisasi
            window.addEventListener( 'DOMContentLoaded', function () {
                
                let container;
                let camera, scene, renderer;
                let controller1, controller2, line;
                let controllerGrip1, controllerGrip2;
                let raycaster;
                let controls, group;

                init();

                function animate() {
                    renderer.render( scene, camera );
                }

                // =======================================================
                // FUNGSI PENGGANTI XRButton.js
                // =======================================================
                function createXRButton( renderer, sessionMode = 'immersive-vr', buttonText = 'START XR' ) {
                    const button = document.createElement( 'button' );
                    button.id = 'xr-button-custom';
                    button.textContent = buttonText;
                    
                    const enterSession = () => {
                        renderer.xr.getSession().then( ( session ) => {
                            session.addEventListener( 'end', onSessionEnd );
                            button.textContent = 'STOP XR';
                        } );
                    };

                    const onSessionEnd = () => {
                        button.textContent = buttonText;
                    };

                    const onSessionStart = () => {
                        if ( renderer.xr.isPresenting ) {
                            renderer.xr.exitSession();
                        } else {
                            // Mencoba sesi 'immersive-ar' terlebih dahulu (jika perangkat mendukungnya)
                            // Jika tidak didukung, fallback ke 'immersive-vr' (mode default three.js controls)
                            navigator.xr.requestSession( 'immersive-ar', { optionalFeatures: [ 'local-floor', 'bounded-floor' ] } )
                                .then( ( session ) => {
                                    renderer.xr.setSession( session );
                                    enterSession();
                                } )
                                .catch( () => {
                                    // Fallback ke immersive-vr jika AR gagal
                                    navigator.xr.requestSession( 'immersive-vr', { optionalFeatures: [ 'local-floor', 'bounded-floor' ] } )
                                        .then( ( session ) => {
                                            renderer.xr.setSession( session );
                                            enterSession();
                                        } )
                                        .catch( ( error ) => {
                                            console.error( 'WebXR session failed to start:', error );
                                            button.textContent = 'NO XR SUPPORT';
                                            button.disabled = true;
                                        } );
                                } );
                        }
                    };

                    if ( 'xr' in navigator ) {
                        navigator.xr.isSessionSupported( 'immersive-ar' )
                            .then( ( supported ) => {
                                if ( supported ) {
                                    button.textContent = buttonText;
                                    button.addEventListener( 'click', onSessionStart );
                                } else {
                                    navigator.xr.isSessionSupported( 'immersive-vr' )
                                        .then( ( supportedVR ) => {
                                            if ( supportedVR ) {
                                                button.textContent = buttonText;
                                                button.addEventListener( 'click', onSessionStart );
                                            } else {
                                                button.textContent = 'NO XR SUPPORT';
                                                button.disabled = true;
                                            }
                                        } );
                                }
                            } );
                    } else {
                        button.textContent = 'NO WEBXR';
                        button.disabled = true;
                    }
                    return button;
                }
                // =======================================================

                function init() {

                    container = document.createElement( 'div' );
                    document.body.appendChild( container );

                    scene = new THREE.Scene();
                    scene.background = new THREE.Color( 0x808080 );

                    camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 10 );
                    camera.position.set( 0, 1.6, 0 );

                    const floorGeometry = new THREE.PlaneGeometry( 6, 6 );
                    const floorMaterial = new THREE.ShadowMaterial( { opacity: 0.25, blending: THREE.NoBlending, transparent: false } ); 
                    const floor = new THREE.Mesh( floorGeometry, floorMaterial );
                    floor.rotation.x = - Math.PI / 2;
                    floor.receiveShadow = true;
                    scene.add( floor );

                    scene.add( new THREE.HemisphereLight( 0xbcbcbc, 0xa5a5a5, 3 ) );

                    const light = new THREE.DirectionalLight( 0xffffff, 3 );
                    light.position.set( 0, 6, 0 );
                    light.castShadow = true;
                    light.shadow.camera.top = 3;
                    light.shadow.camera.bottom = - 3;
                    light.shadow.camera.right = 3;
                    light.shadow.camera.left = - 3;
                    light.shadow.mapSize.set( 4096, 4096 );
                    scene.add( light );

                    group = new THREE.Group();
                    scene.add( group );

                    const geometries = [
                        new THREE.BoxGeometry( 0.2, 0.2, 0.2 ),
                        new THREE.ConeGeometry( 0.2, 0.4, 64 ),
                        new THREE.CylinderGeometry( 0.2, 0.2, 0.2, 64 ),
                        new THREE.IcosahedronGeometry( 0.2, 8 ),
                        new THREE.TorusGeometry( 0.2, 0.04, 64, 32 )
                    ];

                    for ( let i = 0; i < 16; i ++ ) {
                        // ... (Pembuatan objek default)
                        const geometry = geometries[ Math.floor( Math.random() * geometries.length ) ];
                        const material = new THREE.MeshStandardMaterial( {
                            color: Math.random() * 0xffffff,
                            roughness: 0.7,
                            metalness: 0.0
                        } );

                        const object = new THREE.Mesh( geometry, material );

                        object.position.x = Math.random() - 0.5;
                        object.position.y = Math.random() * 2 + 0.5;
                        object.position.z = Math.random() - 2.5;

                        object.rotation.x = Math.random() * 2 * Math.PI;
                        object.rotation.y = Math.random() * 2 * Math.PI;
                        object.rotation.z = Math.random() * 2 * Math.PI;

                        object.scale.setScalar( Math.random() + 0.5 );

                        object.castShadow = true;
                        object.receiveShadow = true;

                        group.add( object );

                    }

                    //

                    renderer = new THREE.WebGLRenderer( { antialias: true } );
                    renderer.setPixelRatio( window.devicePixelRatio );
                    renderer.setSize( window.innerWidth, window.innerHeight );
                    renderer.setAnimationLoop( animate );
                    renderer.shadowMap.enabled = true;
                    renderer.xr.enabled = true;
                    container.appendChild( renderer.domElement );

                    // KRITIS: Menggunakan fungsi createXRButton kustom
                    document.body.appendChild( createXRButton( renderer ) );

                    // controllers
                    controller1 = renderer.xr.getController( 0 );
                    controller1.addEventListener( 'select', onSelect );
                    controller1.addEventListener( 'selectstart', onControllerEvent );
                    controller1.addEventListener( 'selectend', onControllerEvent );
                    controller1.addEventListener( 'move', onControllerEvent );
                    controller1.userData.active = false;
                    scene.add( controller1 );

                    controller2 = renderer.xr.getController( 1 );
                    controller2.addEventListener( 'select', onSelect );
                    controller2.addEventListener( 'selectstart', onControllerEvent );
                    controller2.addEventListener( 'selectend', onControllerEvent );
                    controller2.addEventListener( 'move', onControllerEvent );
                    controller2.userData.active = true;
                    scene.add( controller2 );

                    const controllerModelFactory = new XRControllerModelFactory();

                    controllerGrip1 = renderer.xr.getControllerGrip( 0 );
                    controllerGrip1.add( controllerModelFactory.createControllerModel( controllerGrip1 ) );
                    scene.add( controllerGrip1 );

                    controllerGrip2 = renderer.xr.getControllerGrip( 1 );
                    controllerGrip2.add( controllerModelFactory.createControllerModel( controllerGrip2 ) );
                    scene.add( controllerGrip2 );

                    //

                    const geometry = new THREE.BufferGeometry().setFromPoints( [ new THREE.Vector3( 0, 0, 0 ), new THREE.Vector3( 0, 0, - 1 ) ] );

                    line = new THREE.Line( geometry );
                    line.name = 'line';
                    line.scale.z = 5;

                    raycaster = new THREE.Raycaster();

                    // controls
                    controls = new TransformControls( camera, renderer.domElement );
                    controls.attach( group.children[ 0 ] );
                    scene.add( controls.getHelper() );

                    //

                    window.addEventListener( 'resize', onWindowResize );

                }

                function onSelect( event ) {
                    // ... (Logika onSelect)
                    const controller = event.target;
                    controller1.userData.active = false;
                    controller2.userData.active = false;

                    if ( controller === controller1 ) {
                        controller1.userData.active = true;
                        controller1.add( line );
                    }
                    if ( controller === controller2 ) {
                        controller2.userData.active = true;
                        controller2.add( line );
                    }

                    raycaster.setFromXRController( controller );
                    const intersects = raycaster.intersectObjects( group.children );

                    if ( intersects.length > 0 ) {
                        controls.attach( intersects[ 0 ].object );
                    }
                }

                function onControllerEvent( event ) {
                    // ... (Logika onControllerEvent)
                    const controller = event.target;

                    if ( controller.userData.active === false ) return;

                    controls.getRaycaster().setFromXRController( controller );

                    switch ( event.type ) {

                        case 'selectstart':
                            controls.pointerDown( null );
                            break;

                        case 'selectend':
                            controls.pointerUp( null );
                            break;

                        case 'move':
                            controls.pointerHover( null );
                            controls.pointerMove( null );
                            break;

                    }
                }

                function onWindowResize() {
                    // ... (Logika onWindowResize)
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize( window.innerWidth, window.innerHeight );
                }
            });
		</script>
	</body>
</html>
